# Build the API image, smoke-test it, push it to GHCR.
# The homelab host pulls :main on its own - no inbound access to the homelab
# and no deploy secrets are needed on GitHub.
name: build-and-push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"      # weekly rebuild (Mon 03:23 UTC) -> picks up .NET/alpine security patches
  workflow_dispatch:

permissions:
  contents: read
  packages: write             # GITHUB_TOKEN may push to ghcr.io/<owner>/<repo>

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dieses4lipp/volksbank-tracker-api   # GHCR names must be lowercase

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 1. Build into the local Docker daemon (not pushed yet)
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true                      # always fetch the newest base images
          load: true
          tags: volksbanktracker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Run it exactly as production does and probe it.
      #    A broken image (failed migration, missing native lib) fails here and is never pushed.
      - name: Smoke test
        run: sh scripts/smoke-test.sh volksbanktracker:ci

      # 3. Push only from main / schedule / manual runs, never from PRs
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha            # same layers as step 1 -> no rebuild
