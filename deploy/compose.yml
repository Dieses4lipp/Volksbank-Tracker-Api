services:
  api:
    image: ghcr.io/dieses4lipp/volksbank-tracker-api:main
    container_name: volksbanktracker
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  data:
